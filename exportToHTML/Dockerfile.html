<pre><span class="s0">FROM </span><span class="s1">eclipse-temurin:21-alpine 
</span><span class="s0">VOLUME </span><span class="s1">/tmp 
</span><span class="s0">EXPOSE </span><span class="s1">8080

</span><span class="s0">ADD </span><span class="s1">${JAR_FILE} app.jar 
</span><span class="s0">ENTRYPOINT </span><span class="s1">[</span><span class="s2">&quot;java&quot;</span><span class="s1">,</span><span class="s2">&quot;-jar&quot;</span><span class="s1">,</span><span class="s2">&quot;/app.jar&quot;</span><span class="s1">]</span></pre>
